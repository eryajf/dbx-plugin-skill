name: Release

# 打 tag 即自动：跑测试 → 校验打包内容 → 发布 npm → 建 GitHub Release 并附带产物
#
#   npm version patch && git push --follow-tags
#
# 认证二选一：
#   1) 用 Granular Access Token：仓库 Secret NPM_TOKEN，且该 token 必须勾选
#      "Bypass two-factor authentication (2FA)"，否则 CI 无法完成发布动作。
#      注意：npm 已移除经典/Automation token；带 Bypass 2FA 的直接发布将于 2027-01 起失效。
#   2) npm Trusted Publishing（OIDC，推荐长期方案）：包首次发布后在 npmjs.com 配置
#      Trusted Publisher: GitHub Actions / eryajf / dbx-plugin-skill / release.yml，
#      勾选允许 npm publish，然后删掉 NPM_TOKEN。无需长期 token，也无过期问题。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只打包与校验，不发布
        type: boolean
        default: false

permissions:
  contents: write # 创建 Release
  id-token: write # npm provenance / Trusted Publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 在发布之前就检查权限：否则 npm 已发布成功、创建 Release 才失败，
      # 会留下「npm 上有包、GitHub 上没有 Release」的半成品状态。
      - name: 检查 GITHUB_TOKEN 是否具备写权限
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          perms=$(gh api "repos/${{ github.repository }}" --jq '.permissions.push' 2>/dev/null || echo "unknown")
          echo "contents write = $perms"
          if [ "$perms" = "false" ]; then
            echo "::error::当前 GITHUB_TOKEN 无写权限，无法创建 Release。请到 Settings → Actions → General → Workflow permissions 选择 'Read and write permissions' 后重试。"
            exit 1
          fi
          if [ "$perms" = "unknown" ]; then
            echo "::warning::无法确认 token 权限（不影响后续步骤，但若创建 Release 失败请检查 Workflow permissions）"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 使用最新 npm（OIDC Trusted Publishing 需要 npm >= 11.5.1）
        run: npm install --global npm@latest

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/verify-package.mjs --tag "${{ github.ref_name }}"

      - name: 端到端自检
        run: npm test

      - name: 校验打包内容
        run: node tools/verify-package.mjs

      - name: 构建发布产物
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          (cd skill && zip -q -r "../release-assets/dbx-plugin-${VERSION}.zip" .)
          (cd release-assets && sha256sum ./*.tgz ./*.zip > SHA256SUMS.txt)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -l release-assets

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
            echo "→ 认证方式: NPM_TOKEN"
          else
            echo "→ 认证方式: npm Trusted Publishing (OIDC)"
          fi
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "→ dry-run: 跳过实际发布"
            npm publish --access public --provenance --dry-run
            exit 0
          fi
          if ! npm publish --access public --provenance; then
            {
              echo "::error::npm 发布失败，常见原因："
              echo "  1) NPM_TOKEN 不是 Granular Access Token，或建 token 时没勾选"
              echo "     'Bypass two-factor authentication (2FA)' —— CI 无法完成交互式 2FA"
              echo "  2) token 已过期（看 token 的 Expiration）"
              echo "  3) 已配置 Trusted Publisher 但仓库/用户名/workflow 文件名对不上"
              echo "  4) package.json 版本已存在于 registry（同版本不能重复发布）"
              echo "详见 README 的「npm 发布认证」一节。"
            } >&2
            exit 1
          fi

      - name: 生成 Release Notes
        if: ${{ inputs.dry-run != true }}
        run: |
          cat > notes.md <<'NOTES'
          ## 安装

          ```bash
          npx dbx-plugin-skill install     # 安装技能到 DSH / Claude Code / agents
          npx dbx-plugin-skill doctor      # 环境自检
          ```

          不想用 npm 时，下载下方的 `dbx-plugin-<version>.zip`，解压到
          `~/.dsh/skills/dbx-plugin/`（或 `~/.claude/skills/`、`~/.agents/skills/`）即可。

          ## 产物

          - `dbx-plugin-skill-<version>.tgz` — npm 包（含 skill、安装器与随附脚本）
          - `dbx-plugin-<version>.zip` — 纯 skill 包，供手动安装
          - `SHA256SUMS.txt` — 校验和
          NOTES

      - name: 创建或更新 GitHub Release
        if: ${{ inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "→ Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" \
              --title "dbx-plugin-skill v${VERSION}" \
              --notes-file notes.md \
              --generate-notes \
              release-assets/*
          fi

      - name: 汇总
        run: |
          {
            echo "### 发布结果"
            echo ""
            echo "- 版本: \`v${VERSION}\`"
            echo "- npm: \`dbx-plugin-skill@${VERSION}\`"
            echo "- 产物:"
            ls -1 release-assets | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
