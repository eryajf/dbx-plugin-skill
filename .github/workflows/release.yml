name: Release

# 打 tag 即自动：跑测试 → 校验打包内容 → 发布 npm → 建 GitHub Release 并附带产物
#
#   npm version patch && git push --follow-tags
#
# 认证二选一：
#   1) 配置仓库 Secret NPM_TOKEN（首次发布必须用它，或在本地手动 npm publish 一次）
#   2) 不配置 Secret，改用 npm Trusted Publishing（OIDC）——需先在 npmjs.com 为该包配置
#      Trusted Publisher: GitHub Actions / eryajf/dbx-plugin-skill / release.yml

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 只打包与校验，不发布
        type: boolean
        default: false

permissions:
  contents: write # 创建 Release
  id-token: write # npm provenance / Trusted Publishing

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 使用最新 npm（OIDC Trusted Publishing 需要 npm >= 11.5.1）
        run: npm install --global npm@latest

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: node tools/verify-package.mjs --tag "${{ github.ref_name }}"

      - name: 端到端自检
        run: npm test

      - name: 校验打包内容
        run: node tools/verify-package.mjs

      - name: 构建发布产物
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          npm pack --pack-destination release-assets
          (cd skill && zip -q -r "../release-assets/dbx-plugin-${VERSION}.zip" .)
          (cd release-assets && sha256sum ./*.tgz ./*.zip > SHA256SUMS.txt)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -l release-assets

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
            echo "→ 认证方式: NPM_TOKEN"
          else
            echo "→ 认证方式: npm Trusted Publishing (OIDC)"
          fi
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "→ dry-run: 跳过实际发布"
            npm publish --access public --provenance --dry-run
          else
            npm publish --access public --provenance
          fi

      - name: 生成 Release Notes
        if: ${{ inputs.dry-run != true }}
        run: |
          cat > notes.md <<'NOTES'
          ## 安装

          ```bash
          npx dbx-plugin-skill install     # 安装技能到 DSH / Claude Code / agents
          npx dbx-plugin-skill doctor      # 环境自检
          ```

          不想用 npm 时，下载下方的 `dbx-plugin-<version>.zip`，解压到
          `~/.dsh/skills/dbx-plugin/`（或 `~/.claude/skills/`、`~/.agents/skills/`）即可。

          ## 产物

          - `dbx-plugin-skill-<version>.tgz` — npm 包（含 skill、安装器与随附脚本）
          - `dbx-plugin-<version>.zip` — 纯 skill 包，供手动安装
          - `SHA256SUMS.txt` — 校验和
          NOTES

      - name: 创建或更新 GitHub Release
        if: ${{ inputs.dry-run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "→ Release $TAG 已存在，覆盖上传产物"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" \
              --title "dbx-plugin-skill v${VERSION}" \
              --notes-file notes.md \
              --generate-notes \
              release-assets/*
          fi

      - name: 汇总
        run: |
          {
            echo "### 发布结果"
            echo ""
            echo "- 版本: \`v${VERSION}\`"
            echo "- npm: \`dbx-plugin-skill@${VERSION}\`"
            echo "- 产物:"
            ls -1 release-assets | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
